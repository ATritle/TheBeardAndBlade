<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iron Matriarch cinematic intro</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#eee5d1;font:16px system-ui;padding:20px;min-height:100vh;display:grid;place-items:center}main{width:min(1150px,100%)}h1{font-size:18px;font-weight:500}.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:repeating-linear-gradient(0deg,transparent 0 62px,#111820 63px 66px),repeating-linear-gradient(90deg,#273038 0 110px,#182129 111px 115px)}.stage:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent,#02050bbb)}.dim{position:absolute;inset:0;background:#0008;opacity:0}.boss{position:absolute;left:13%;top:0%;width:74%;height:83%;object-fit:contain;image-rendering:pixelated;opacity:0}.name{position:absolute;left:14%;bottom:5%;width:72%;height:30%;object-fit:contain;image-rendering:pixelated;opacity:0;z-index:3}.flash{position:absolute;inset:0;background:#ffce81;opacity:0;pointer-events:none;z-index:4}.bar{position:absolute;left:0;right:0;height:5%;background:#05070c;transform:scaleY(0);z-index:5}.top{top:0;transform-origin:top}.bottom{bottom:0;transform-origin:bottom}.controls{display:flex;gap:15px;align-items:center;flex-wrap:wrap;margin-top:16px}button{padding:12px 20px;background:#ddaa52;color:#12151b;border:0;font:600 16px system-ui;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:3px}.note{font-size:14px;color:#bdc5d0}.play .boss{animation:boss 6s both}.play .name{animation:name 6s both}.play .dim{animation:dim 6s both}.play .flash{animation:flash 6s both}.play .bar{animation:bar 6s both}
@keyframes boss{0%,5%{opacity:0;transform:translateX(-160%) rotate(-10deg) scale(.9)}5.1%{opacity:1;transform:translateX(-160%) rotate(-10deg) scale(.9);animation-timing-function:linear}12%{opacity:1;transform:translateX(-85%) rotate(-7deg) scale(.94);animation-timing-function:linear}20%{opacity:1;transform:translateX(-25%) rotate(-3deg) scale(1);animation-timing-function:ease-out}25%{opacity:1;transform:translateX(5%) rotate(2deg) scale(1.03)}28%{opacity:1;transform:translateX(0) rotate(0) scale(1)}35%,40%{opacity:1;transform:translateX(0) scale(1)}41%{transform:translateX(-.5%)}42%{transform:translateX(.3%)}44%,85%{opacity:1;transform:translateX(0) scale(1)}98%,100%{opacity:0;transform:translateX(0) scale(1.03)}}
@keyframes name{0%,34.9%{opacity:0;transform:translateX(-160%) scale(1.15)}35%{opacity:1;transform:translateX(-160%) scale(1.15);animation-timing-function:ease-out}40%{opacity:1;transform:translateX(0) scale(1.12);filter:brightness(1.8)}44%,85%{opacity:1;transform:translateX(0) scale(1);filter:brightness(1)}98%,100%{opacity:0;transform:scale(1.04)}}
@keyframes dim{0%{opacity:0}10%,85%{opacity:1}100%{opacity:0}}@keyframes bar{0%{transform:scaleY(0)}10%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}@keyframes flash{0%,39.8%{opacity:0}40%{opacity:.35}43%,100%{opacity:0}}
.reduced.play .boss{animation:none;opacity:1}.reduced.play .name{animation:reduced-title 6s both}.reduced.play .flash{animation:none}.reduced.play .bar{animation:none}.reduced.play .dim{animation:none;opacity:1}@keyframes reduced-title{0%,35%{opacity:0}45%,100%{opacity:1}}
</style></head><body><main><h1>Iron Matriarch · mechanical dragon cinematic</h1><div class="stage" aria-label="Iron Matriarch enters first; she overshoots and settles, rests for 0.42 seconds, then her name rushes in."><div class="dim"></div><img class="boss" src="character.png" alt="Iron Matriarch five-headed mechanical dragon queen"><img class="name" src="title.png" alt="Iron Matriarch"><div class="flash"></div><div class="bar top"></div><div class="bar bottom"></div></div><div class="controls"><button id="play">Play cinematic</button><label><input id="sound" type="checkbox" checked> Sound</label><label><input id="reduce-motion" type="checkbox"> Reduced motion</label><label>Volume <input id="volume" type="range" min="0" max="1" value="0.35" step="0.01"></label></div><p class="note">Embers + metal sparks + impact bursts · 6-second concept · placeholder dungeon floor · Dragon: Snarl, Roar + Attack · Breviceps · CC0</p></main>
<script>
const stage=document.querySelector('.stage'),button=document.getElementById('play'),sound=document.getElementById('sound'),volume=document.getElementById('volume');
const roar=new Audio('intro-breviceps-roar.wav');roar.preload='auto';
function gain(){roar.volume=Number(volume.value);roar.muted=!sound.checked;}
async function play(){button.disabled=true;roar.pause();roar.currentTime=0;gain();stage.classList.remove('play');void stage.offsetWidth;
try{await roar.play();button.textContent='Replay cinematic';}catch(e){button.textContent='Replay (audio unavailable)';}
stage.classList.add('play');button.disabled=false;}
document.getElementById('reduce-motion').addEventListener('change',e=>stage.classList.toggle('reduced',e.target.checked));
button.addEventListener('click',play);sound.addEventListener('change',gain);volume.addEventListener('input',gain);
window.addEventListener('pagehide',()=>roar.pause());
</script><script src="effects.js"></script></body></html>
